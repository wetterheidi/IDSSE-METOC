server {
    listen 80;
    server_name idsse.wetterheidi.de;

    root /apps/IDSSE-METOC;
    index index.html;

    # Pförtner-Login (siehe Nutzerverwaltung-Repo, Tool-Name "idsse") --
    # ersetzt das frühere auth_basic/.htpasswd.
    set $pfoertner_tool idsse;

    location / {
        auth_request /_pfoertner;
        error_page 401 = @zum_login;
        error_page 403 /gesperrt.html;

        try_files $uri $uri/ =404;
    }

    include snippets/pfoertner.conf;
}
