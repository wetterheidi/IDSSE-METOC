server {
    listen 80;
    server_name idsseml.wetterheidi.de;

    root /apps/IDSSE-METOC-modellevel;
    index index.html;

    # Pförtner-Login (siehe Nutzerverwaltung-Repo, Tool-Name "idsseml") --
    # ersetzt das frühere auth_basic/.htpasswd.
    set $pfoertner_tool idsseml;

    location / {
        auth_request /_pfoertner;
        error_page 401 = @zum_login;
        error_page 403 /gesperrt.html;

        try_files $uri $uri/ =404;
    }

    include snippets/pfoertner.conf;
}
