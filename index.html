<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDSSE-M Cockpit</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="page-container">

        <header class="page-header">
            IDSSE-M Cockpit
            <div id="slider-container">
                <div class="slider-content-wrapper">

                    <div class="time-row">
                        <span id="selectedTime">Ausgewählte Zeit: --:--</span>
                        <div id="autoupdateToggle">
                            <label for="autoupdateCheckbox" title="Autoupdate">⟳</label>
                            <input type="checkbox" id="autoupdateCheckbox">
                        </div>
                    </div>

                    <div class="slider-wrapper">
                        <div id="slider-track-highlight"></div>
                        <input type="range" id="timeSlider" min="0" max="23" value="0" disabled>
                        <div id="slider-labels"></div>
                    </div>

                    <div id="model-row">
                        <label id="modelLabel" for="modelSelect" title="Modell-Lauf">Modell:</label>
                        <select id="modelSelect">
                            <option value="">-- Lade Modelle --</option>
                        </select>
                        <button id="modelInfoButton" class="info-button-shared">i</button>
                        <div id="modelInfoPopup" class="info-popup"></div>
                    </div>

                </div>
            </div>
            <div style="float: right; font-size: 0.8em; margin-right: 20px; line-height: 20px;">
                <label for="demoModeCheckbox" style="cursor: pointer;">
                    <input type="checkbox" id="demoModeCheckbox" style="cursor: pointer;">
                    Demo-Modus (Offline)
                </label>
            </div>
        </header>

        <div id="sidebar">

            <button class="accordion-header active">Automatischer Monitor</button>
            <div class="accordion-panel" style="max-height: 200px;"> <button id="runAutoCheckButton">Voll-Check jetzt
                    starten</button>
                <div id="autoWarnDashboard">
                    <p>Starte automatische Prüfung...</p>
                </div>
            </div>

            <button class="accordion-header">Profile & Vorlagen</button>
            <div class="accordion-panel">
                <h4>Gespeicherte Profile:</h4>
                <ul id="profileList"></ul>
                <hr>

                <h4>Neues Profil erstellen:</h4>

                <div class="setting-group" style="padding-bottom: 10px;">
                    <strong>Einheiten-Modus:</strong>
                    <br>
                    <label style="display: inline; margin-left: 10px;">
                        <input type="radio" name="unitMode" value="metric" checked> Metrisch (m, km/h, °C)
                    </label>
                    <br>
                    <label style="display: inline; margin-left: 10px;">
                        <input type="radio" name="unitMode" value="aviation"> Aviation (ft, kts, °C)
                    </label>
                </div>
                <input type="text" id="profileName" placeholder="Profil-Name (z.B. Heli A)">

                <label for="maxWind">Max. Windböe (km/h):</label>
                <input type="number" id="maxWind" value="60">
                <br>
                <label for="minTemp">Min. Temperatur (°C):</label>
                <input type="number" id="minTemp" value="0">
                <br>
                <label for="minVis">Min. Sichtweite (Meter):</label>
                <input type="number" id="minVis" value="5000">
                <br>
                <label for="minCloud">Min. Wolkenuntergrenze (Meter):</label>
                <input type="number" id="minCloud" value="500">
                <br>
                <label for="maxPrecipProb">Max. Niederschl.-Chance (%):</label>
                <input type="number" id="maxPrecipProb" value="30">
                <hr>

                <button id="saveButton" disabled>Aktuelles Shape speichern</button>

                <div style="background: #eee; padding: 5px; margin-top: 10px; border-radius: 5px;">
                    <label for="templateName">Name für Regeln:</label>
                    <input type="text" id="templateName" placeholder="z.B. 'Heli VFR'">
                    <button id="saveTemplateButton">Regeln als Vorlage speichern</button>
                    <hr style="margin: 5px 0;">
                    <label for="templateSelect">Vorlage laden:</label>
                    <select id="templateSelect">
                        <option value="">-- Vorlage wählen --</option>
                    </select>
                </div>
            </div>

            <button class="accordion-header">Daten-Backup</button>
            <div class="accordion-panel">
                <button id="exportButton">Alle Profile exportieren</button>
                <br><br>
                <input type="file" id="importFile" accept=".json" style="display: none;">
                <button id="importButton">Profile importieren</button>
            </div>

        </div>
        <div id="map"></div>

        <footer class="page-footer">

            <div class="footer-tabs">
                <button id="showMatrixTab" class="footer-tab active">Ampel-Matrix</button>
                <button id="showGraphTab" class="footer-tab">24h-Graph</button>
            </div>

            <div class="footer-content">

                <div id="manualWarningMonitor" class="footer-tab-content active">
                    Keine manuelle Prüfung aktiv.
                </div>

                <div id="graphContainer" class="footer-tab-content">
                    <canvas id="weatherChartCanvas"></canvas>
                </div>

            </div>
        </footer>

    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@latest/turf.min.js"></script>
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
