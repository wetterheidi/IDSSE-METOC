<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Geoman (Strukturiert)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">
        <div id="sidebar">
            <h3>Automatischer Monitor</h3>
            <button id="runAutoCheckButton">Voll-Check jetzt starten</button>
            <div id="autoWarnDashboard"
                style="background: #fff; border: 1px solid #555; padding: 5px; min-height: 150px; overflow-y: auto; margin-top: 10px;">
                <p>Starte automatische Prüfung...</p>
            </div>

            <hr>
            <h3>Profile verwalten</h3>
            <ul id="profileList">
            </ul>

            <hr>
            <h4>Neues Profil erstellen:</h4>
            <input type="text" id="profileName" placeholder="Profil-Name (z.B. Heli A)">
            <button id="saveButton" disabled>Aktuelles Shape speichern</button>

            <hr>
            <h4>Manuelle Einzelprüfung:</h4>
            <div id="manualWarningMonitor"
                style="background: #f4f4f4; border: 1px solid #ccc; padding: 5px; min-height: 100px; overflow-y: auto;">
                Keine manuelle Prüfung aktiv.
            </div>
        </div>
        <div id="map"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script src="https://unpkg.com/@turf/turf@latest/turf.min.js"></script>

    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>

    <script src="app.js"></script>

</body>

</html>
