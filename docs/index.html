<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDSSE-M Cockpit</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.19.2/dist/leaflet-geoman.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4.8" />
</head>

<body>

    <div class="page-container">

        <header class="page-header">
            <div class="header-left-compact">
                <span class="header-title">IDSSE-M Cockpit</span>
                <div class="header-controls">
                    <button id="themeToggle" title="Design wechseln">☀️</button>
                    <div id="demoBadge" class="demo-badge hidden" title="Demo-Modus aktiv (Shift+D zum Deaktivieren)">DEMO</div>
                </div>
                <!-- Checkbox bleibt im DOM, wird aber nicht angezeigt -->
                <input type="checkbox" id="demoModeCheckbox" class="hidden">
            </div>

            <div id="slider-container">
                <div class="slider-content-wrapper">

                    <div class="time-model-row-compact">
                        <span id="selectedTime">Zeit: --:--</span>
                        <div id="autoupdateToggle">
                            <label for="autoupdateCheckbox" title="Auto-Update ein/aus">⟳</label>
                            <input type="checkbox" id="autoupdateCheckbox">
                        </div>
                        <select id="modelSelect">
                            <option value="">-- Lade Modelle --</option>
                        </select>
                        <button id="modelInfoButton" class="info-button-shared">i</button>
                        <div id="modelInfoPopup" class="info-popup"></div>
                        <select id="daySelect">
                            <option value="0">Lade Tage...</option>
                        </select>
                    </div>

                    <div class="slider-wrapper">
                        <div id="slider-track-highlight"></div>
                        <input type="range" id="timeSlider" min="0" max="23" value="0" disabled>
                        <div id="slider-labels"></div>
                    </div>

                </div>
            </div>
        </header>

        <div id="sidebar">
            <button id="sidebarToggle" title="Sidebar einklappen">◀</button>

            <!-- SEKTION 1: Profil erstellen -->
            <button class="accordion-header"><span class="acc-icon">✍️</span><span class="acc-text"> Profil erstellen</span></button>
            <div class="accordion-panel">

                <div class="workflow-step">
                    <span class="step-badge">1</span>
                    <span class="step-label">Gebiet auf Karte zeichnen</span>
                </div>
                <div id="mapStatusContainer">
                    <div id="mapStatusText">⚠️ Bitte zuerst eine Area auf der Karte definieren.</div>
                </div>

                <div class="workflow-step">
                    <span class="step-badge">2</span>
                    <span class="step-label">Profil benennen</span>
                </div>
                <input type="text" id="profileName" placeholder="z.B. Heli A" maxlength="50">

                <div id="rules-workflow-container" class="hidden">
                    <div class="workflow-step">
                        <span class="step-badge">3</span>
                        <span class="step-label">Regeln definieren</span>
                    </div>

                    <div class="settings-row">
                        <div class="settings-col">
                            <span class="settings-label">Einheiten</span>
                            <label class="radio-label"><input type="radio" name="unitMode" value="metric" checked> Metrisch</label>
                            <label class="radio-label"><input type="radio" name="unitMode" value="aviation"> Aviation</label>
                        </div>
                        <div class="settings-col">
                            <span class="settings-label">Logik</span>
                            <label class="radio-label"><input type="radio" name="logicMode" value="OR" checked> ODER</label>
                            <label class="radio-label"><input type="radio" name="logicMode" value="AND"> UND</label>
                        </div>
                    </div>

                    <div class="rule-input-container" id="dynamic-rules-container"></div>
                </div>

                <div id="custom-row-settings" class="setting-group">
                    <label class="flex-label">
                        <input type="checkbox" id="customRowEnabled" class="checkbox-inline">
                        <span>Manuelle Ampelzeile einfügen</span>
                    </label>
                    <div id="custom-row-name-container" class="hidden">
                        <input type="text" id="customRowName" placeholder="Name der Zeile" maxlength="50">
                    </div>
                </div>

                <div class="workflow-step">
                    <span class="step-badge">4</span>
                    <span class="step-label">Profil speichern</span>
                </div>
                <button id="saveButton" class="btn-primary" disabled>Profil speichern</button>
            </div>

            <!-- SEKTION 2: Profile laden -->
            <button class="accordion-header"><span class="acc-icon">📂</span><span class="acc-text"> Gespeicherte Profile</span></button>
            <div class="accordion-panel">
                <ul id="profileList" class="profile-card-list"></ul>
            </div>

            <!-- SEKTION 3: Vorlagen -->
            <button class="accordion-header"><span class="acc-icon">📖</span><span class="acc-text"> Vorlagen</span></button>
            <div class="accordion-panel">
                <div class="template-box">
                    <label for="templateSelect" class="settings-label">Vorlage laden</label>
                    <select id="templateSelect">
                        <option value="">-- Vorlage wählen --</option>
                    </select>
                    <div class="btn-row">
                        <button id="loadTemplateButton" class="btn-success btn-half">Laden</button>
                        <button id="deleteTemplateButton" class="btn-danger btn-half">Löschen</button>
                    </div>
                    <hr class="sidebar-separator-sm">
                    <label for="templateName" class="settings-label">Aktuelle Regeln speichern</label>
                    <input type="text" id="templateName" placeholder="Name (z.B. Heli VFR)" maxlength="50">
                    <button id="saveTemplateButton" class="btn-primary">Als Vorlage speichern</button>
                </div>
            </div>

            <!-- SEKTION 4: Export/Import -->
            <button class="accordion-header"><span class="acc-icon">☁️</span><span class="acc-text"> Export / Import</span></button>
            <div class="accordion-panel">
                <div class="btn-row">
                    <button id="exportButton" class="btn-half">Exportieren</button>
                    <button id="importButton" class="btn-half">Importieren</button>
                </div>
                <input type="file" id="importFile" accept=".json" class="hidden">
            </div>

        </div>
        <div id="map"></div>

        <footer class="page-footer">

            <div id="footer-resize-handle"></div>

            <div class="footer-tabs">
                <button id="showAutoTab" class="footer-tab active">Auto-Monitor</button>
                <button id="showMatrixTab" class="footer-tab">Ampel-Matrix</button>
                <button id="showGraphTab" class="footer-tab">24h-Graph</button>
            </div>

            <div class="footer-content">

                <div id="autoWarnDashboard" class="footer-tab-content active">
                    <p>Lade Auto-Monitor...</p>
                </div>

                <div id="manualWarningMonitor" class="footer-tab-content">
                    Keine manuelle Prüfung aktiv.
                </div>

                <div id="graphContainer" class="footer-tab-content">
                    <canvas id="weatherChartCanvas"></canvas>
                </div>

            </div>
        </footer>

    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.19.2/dist/leaflet-geoman.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@7.3.4/turf.min.js"></script>
    <script src="https://unpkg.com/dexie@3.2.7/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
    <script type="module" src="main.js"></script>
    <script type="module" src="cloudBaseTests.js"></script>
    <script>
        // Theme wird VOR DOMContentLoaded angewendet, damit kein Aufflackern entsteht
        (function () {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
            }
        })();

        document.addEventListener('DOMContentLoaded', () => {
            // --- Sidebar Toggle ---
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');
            const container = document.querySelector('.page-container');
            if (sidebarToggle && sidebar && container) {
                sidebarToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    const isCollapsed = sidebar.classList.contains('collapsed');
                    container.style.gridTemplateColumns = isCollapsed ? '48px 1fr' : '350px 1fr';
                });
            }

            // --- Theme Toggle ---
            const themeToggle = document.getElementById('themeToggle');
            if (!themeToggle) return;

            function applyTheme(isDark) {
                document.body.classList.toggle('dark', isDark);
                themeToggle.textContent = isDark ? '☀️' : '🌙';
                themeToggle.title = isDark ? 'Helles Design aktivieren' : 'Dunkles Design aktivieren';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            const isDark = document.body.classList.contains('dark');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            themeToggle.title = isDark ? 'Helles Design aktivieren' : 'Dunkles Design aktivieren';

            themeToggle.addEventListener('click', () => {
                applyTheme(!document.body.classList.contains('dark'));
            });

            // --- Demo-Modus: Shift+D ---
            const demoCheckbox = document.getElementById('demoModeCheckbox');
            const demoBadge = document.getElementById('demoBadge');

            function syncDemoBadge() {
                if (!demoBadge || !demoCheckbox) return;
                demoBadge.classList.toggle('hidden', !demoCheckbox.checked);
            }

            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'D' && demoCheckbox) {
                    demoCheckbox.checked = !demoCheckbox.checked;
                    syncDemoBadge();
                    // Change-Event auslösen, damit main.js reagiert
                    demoCheckbox.dispatchEvent(new Event('change'));
                }
            });
        });
    </script>
</body>

</html>
