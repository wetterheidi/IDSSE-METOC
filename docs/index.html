<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDSSE-M Cockpit</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="page-container">

        <header class="page-header">
            <div class="header-left-compact"> IDSSE-M Cockpit
                <div id="demoModeCompact"> <label for="demoModeCheckbox" style="cursor: pointer;">
                        <input type="checkbox" id="demoModeCheckbox" style="cursor: pointer;">
                        Demo-Modus
                    </label>
                </div>
            </div>

            <div id="slider-container">
                <div class="slider-content-wrapper">

                    <div class="time-model-row-compact"> <span id="selectedTime">Zeit: --:--</span>
                        <div id="autoupdateToggle">
                            <label for="autoupdateCheckbox" title="Autoupdate">⟳</label>
                            <input type="checkbox" id="autoupdateCheckbox">
                        </div>

                        <select id="modelSelect">
                            <option value="">-- Lade Modelle --</option>
                        </select>
                        <button id="modelInfoButton" class="info-button-shared">i</button>
                        <div id="modelInfoPopup" class="info-popup"></div>
                    </div>

                    <div class="slider-wrapper">
                        <div id="slider-track-highlight"></div>
                        <input type="range" id="timeSlider" min="0" max="23" value="0" disabled>
                        <div id="slider-labels"></div>
                    </div>

                </div>
            </div>
        </header>

        <div id="sidebar">

            <button class="accordion-header">✍️ Profil erstellen / Regeln definieren</button>
            <div class="accordion-panel">

                <div class="setting-group" style="padding-bottom: 10px;">
                    <strong>Einheiten-Modus:</strong>
                    <br>
                    <label style="display: inline; margin-left: 10px;">
                        <input type="radio" name="unitMode" value="metric" checked> Metrisch (m, km/h, °C)
                    </label>
                    <br>
                    <label style="display: inline; margin-left: 10px;">
                        <input type="radio" name="unitMode" value="aviation"> Aviation (ft, kt, °C)
                    </label>
                </div>
                <div class="setting-group" style="padding-bottom: 10px; margin-top: 10px;">
                    <strong>Logik-Modus (Gesamt-Status):</strong>
                    <br>
                    <label style="display: inline; margin-left: 10px;">
                        <input type="radio" name="logicMode" value="OR" checked> ODER (Wenn 1 Regel auslöst)
                    </label>
                    <br>
                    <label style="display: inline; margin-left: 10px;">
                        <input type="radio" name="logicMode" value="AND"> UND (Wenn ALLE Regeln auslösen)
                    </label>
                </div>

                <input type="text" id="profileName" placeholder="1. Profil-Name (z.B. Heli A)">

                <div style="background: #eee; padding: 5px; margin-top: 10px; border-radius: 5px;">
                    <label for="templateName">Name für Regeln:</label>
                    <input type="text" id="templateName" placeholder="z.B. 'Heli VFR'">
                    <button id="saveTemplateButton">Regeln als Vorlage speichern</button>
                    <hr style="margin: 5px 0;">
                    <label for="templateSelect">Vorlage laden (Workflow-Start):</label>
                    <select id="templateSelect">
                        <option value="">-- Vorlage wählen --</option>
                    </select>
                </div>
                <details open
                    style="margin-bottom: 10px; border-left: 3px solid var(--color-primary); padding-left: 8px;">
                    <summary style="font-weight: bold; cursor: pointer; padding: 5px 0;">2. Schwellenwerte definieren
                        (Klicken zum Ausklappen)</summary>
                    <div class="rule-input-container" id="dynamic-rules-container">
                    </div>
                    <div id="mapStatusContainer"
                        style="margin-top: 10px; padding: 10px; border: 1px dashed var(--border-color-strong); border-radius: var(--border-radius);">
                        <div id="mapStatusText">
                            ⚠️ **3. Area zeichnen:** Bitte zuerst eine Area auf der Karte definieren.
                        </div>
                    </div>
                </details>

                <button id="saveButton" disabled>4. Aktuelles Shape speichern</button>

            </div>

            <button class="accordion-header">📂 Gespeicherte Profile & Vorlagen laden</button>
            <div class="accordion-panel">
                <h4>Profile verwalten:</h4>
                <ul id="profileList"></ul>
                <hr>
            </div>

            <button class="accordion-header">☁️ Daten-Export / Import</button>
            <div class="accordion-panel">
                <button id="exportButton">Alle Profile exportieren</button>
                <br><br>
                <input type="file" id="importFile" accept=".json" style="display: none;">
                <button id="importButton">Profile importieren</button>
            </div>

        </div>
        <div id="map"></div>

        <footer class="page-footer">

            <div id="footer-resize-handle"></div>

            <div class="footer-tabs">
                <button id="showMatrixTab" class="footer-tab active">Monitor</button>
                <button id="showGraphTab" class="footer-tab">24h-Graph</button>
            </div>

            <div class="footer-content">

                <div id="manualWarningMonitor" class="footer-tab-content active">
                    Keine manuelle Prüfung aktiv.
                </div>

                <div id="graphContainer" class="footer-tab-content">
                    <canvas id="weatherChartCanvas"></canvas>
                </div>

            </div>
        </footer>

    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@latest/turf.min.js"></script>
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
